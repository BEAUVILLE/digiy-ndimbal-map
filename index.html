<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DIGIY NDIMBAL MAP — Saly Multi-QG × Modules ∞</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <style>
    :root{
      --bg:#020617;
      --card:#030712;
      --accent:#facc15;
      --accent2:#22c55e;
      --ink:#f9fafb;
      --muted:#cbd5e1;
      --border:rgba(148,163,184,0.35);

      --qg-centre:#f97316;
      --qg-station:#0ea5e9;
      --qg-niakhal:#10b981;

      --module-driver:#0ea5e9;
      --module-resto:#f97316;
      --module-loc:#10b981;
      --module-market:#ec4899;
      --module-build:#eab308;
      --module-explore:#8b5cf6;
      --module-jobs:#6366f1;
    }

    *{ box-sizing:border-box; margin:0; padding:0; }

    body{
      font-family:system-ui,-apple-system,sans-serif;
      color:var(--ink);
      background:var(--bg);
      overflow:hidden;
    }

    /* ✅ HEADER COMPACT */
    .digiy-header{
      background: linear-gradient(135deg,#facc15,#f97316);
      color:#111;
      padding:10px 12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      box-shadow:0 4px 16px rgba(250,204,21,0.35);
      position:relative;
      z-index:1000;
    }

    .header-brand{
      display:flex;
      gap:10px;
      align-items:center;
      min-width:0;
    }

    .brand-logo{
      width:38px;
      height:38px;
      border-radius:12px;
      background: radial-gradient(circle at 30% 0%, #facc15, #f97316);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:20px;
      box-shadow:0 8px 18px rgba(250,204,21,0.35);
      flex:0 0 auto;
    }

    .brand-text h1{
      font-size:16px;
      font-weight:1000;
      text-transform:uppercase;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .brand-text p{
      font-size:11px;
      opacity:.9;
      font-weight:900;
      margin-top:2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .header-stats{
      display:flex;
      gap:8px;
      align-items:center;
      justify-content:flex-end;
    }

    .stat-link{
      text-decoration:none;
      color:#111;
      font-weight:1000;
      background:rgba(255,255,255,0.35);
      border:1px solid rgba(0,0,0,0.12);
      padding:6px 9px;
      border-radius:9px;
    }

    .stat-btn{
      padding:6px 9px;
      border-radius:9px;
      background:rgba(0,0,0,0.25);
      border:1px solid rgba(0,0,0,0.15);
      font-size:11px;
      font-weight:1000;
      cursor:pointer;
      color:#111;
    }

    .stat-badge{
      padding:6px 9px;
      border-radius:9px;
      background:rgba(0,0,0,0.25);
      border:1px solid rgba(0,0,0,0.15);
      font-size:11px;
      font-weight:1000;
      color:#111;
    }

    /* ✅ MAP */
    #map{
      position:absolute;
      top:64px;
      left:0;
      right:0;
      bottom:0;
      z-index:1;
    }

    /* ✅ MARKER */
    .digiy-marker{
      background:linear-gradient(135deg,var(--accent),#f97316);
      border:3px solid #fff;
      border-radius:50% 50% 50% 0;
      width:38px;height:38px;
      transform:rotate(-45deg);
      box-shadow:0 4px 14px rgba(0,0,0,0.4);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:19px;
    }
    .digiy-marker span{ transform:rotate(45deg); }

    .digiy-marker.module-loc{ background:var(--module-loc); }
    .digiy-marker.module-driver{ background:var(--module-driver); }
    .digiy-marker.module-market{ background:var(--module-market); }
    .digiy-marker.module-build{ background:var(--module-build); }
    .digiy-marker.module-explore{ background:var(--module-explore); }

  </style>
</head>

<body>

<!-- ✅ HEADER -->
<header class="digiy-header">
  <div class="header-brand">
    <div class="brand-logo">🗺️</div>
    <div class="brand-text">
      <h1>DIGIY NDIMBAL MAP</h1>
      <p>Saly Multi-QG × Modules • 0% Commission ∞</p>
    </div>
  </div>

  <div class="header-stats">
    <a class="stat-link" href="https://digiylyfe.com" target="_blank">← HUB</a>
    <button class="stat-btn" type="button" onclick="locateMe()">📍 Moi</button>
    <button class="stat-btn" type="button" onclick="toggleLocLive()" id="btnLocLive">
      🏠 LOC LIVE: ON
    </button>
    <div class="stat-badge" id="statPartners">—</div>
  </div>
</header>

<!-- ✅ MAP -->
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<!-- ✅ Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ==========================================
   DIGIY NDIMBAL MAP — CORE CLEAN
========================================== */

const SUPABASE_URL = "https://wesqmwjjtsefyjnluosj.supabase.co";
const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indlc3Ftd2pqdHNlZnlqbmx1b3NqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUxNzg4ODIsImV4cCI6MjA4MDc1NDg4Mn0.dZfYOc2iL2_wRYL3zExZFsFSBK6AbMeOid2LrIjcTdA";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let map, markers;
let locLiveEnabled = true;
let locLiveCluster = null;

/* ✅ INIT MAP */
function initMap(){
  map = L.map("map").setView([14.4518,-16.9946],14);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    attribution:"© OpenStreetMap | DIGIYLYFE ∞",
    maxZoom:19
  }).addTo(map);

  markers = L.markerClusterGroup();
  map.addLayer(markers);

  document.getElementById("statPartners").textContent = "NDIMBAL READY ✅";
}

function locateMe(){
  alert("📍 GPS bientôt connecté full frérot 😄");
}

/* ✅ LOC LIVE TOGGLE */
function toggleLocLive(){
  locLiveEnabled = !locLiveEnabled;
  const btn = document.getElementById("btnLocLive");

  btn.textContent = "🏠 LOC LIVE: " + (locLiveEnabled ? "ON" : "OFF");

  if(!locLiveCluster) return;

  if(locLiveEnabled){
    if(!map.hasLayer(locLiveCluster)){
      map.addLayer(locLiveCluster);
    }
  } else {
    if(map.hasLayer(locLiveCluster)){
      map.removeLayer(locLiveCluster);
    }
  }
}

/* ✅ START — DOM READY */
document.addEventListener("DOMContentLoaded", () => {
  console.log("✅ NDIMBAL MAP — START");

  initAll();
});

/* ✅ INIT GLOBAL */
function initAll(){
  if(typeof L === "undefined"){
    console.warn("Leaflet pas encore chargé…");
    return;
  }

  initMap();
  initSearch();
  initMobileHandlers();

  // ✅ fallback direct Joseph au démarrage
  setMePos(SALY_JOSEPH.lat, SALY_JOSEPH.lng, true);

  updateHeaderBadges(partners);

  // ✅ Charger DIGIY LOC LIVE pins
  loadLocLivePins();

  console.log("✅ NDIMBAL MAP READY FULL");
}
</script>

  </body>
</html>
